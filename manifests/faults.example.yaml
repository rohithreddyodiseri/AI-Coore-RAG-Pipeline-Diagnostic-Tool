  # Append noise to the relevant microbial dose-response section (section_id 17).
  - query_id: "9199173b-3ed1-4118-88cd-1713fc5fa8a7"
    failure_type: missed_top_ranked
    injection_config:
      noise: "Unrelated context: gardening, travel, cooking and sports. "
      repeat: 500


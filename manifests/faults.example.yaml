  - query_id: "283afa84-f0c8-40a7-a6f1-fb2a6b97c761"
    failure_type: not_extracted
    injection_config:
      prefix: "Correction: the following claims about uncertainty are unreliable. "
      suffix: " In contrast, uncertainty has no effect on these problems."

  # Retain only half of the relevant section about job transition predictions.
  - query_id: "f210906a-b4a4-4b97-84df-106214024650"
    failure_type: incomplete_answer
    injection_config:
      keep_fraction: 0.5
